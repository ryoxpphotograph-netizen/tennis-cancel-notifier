name: 自動停止の防止

# GitHub は60日間リポジトリに更新がないと定期実行を止めるため、
# 月に1回、空のコミットを入れて「使用中」の状態を保つ
on:
  schedule:
    - cron: "0 0 1 * *"  # 毎月1日 9:00 (日本時間)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "自動停止の防止 (月次)"
          git push
